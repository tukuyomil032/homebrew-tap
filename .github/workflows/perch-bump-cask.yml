name: Bump Cask (perch)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Update perch cask if a new release exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="tukuyomil032/Perch"
          CASK_FILE="Casks/perch.rb"
          API_URL="https://api.github.com/repos/${REPO}/releases/latest"

          CURRENT=$(ruby -e 'puts File.read(ARGV[0])[/^\s*version\s+"([^"]+)"/, 1].to_s' "$CASK_FILE")
          if [ -z "$CURRENT" ]; then
            echo "Failed to read current version from ${CASK_FILE}" >&2
            exit 1
          fi

          RESPONSE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$API_URL")
          LATEST=$(printf '%s' "$RESPONSE" | jq -r '.tag_name // ""' | sed 's/^v//')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to read latest release tag from ${API_URL}" >&2
            exit 1
          fi

          echo "Current: ${CURRENT}"
          echo "Latest: ${LATEST}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "No cask update required."
            exit 0
          fi

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          DMG_FILE="perch-${LATEST}.dmg"
          DMG_URL="https://github.com/${REPO}/releases/download/v${LATEST}/${DMG_FILE}"

          echo "Downloading ${DMG_URL}..."
          curl -fL "$DMG_URL" -o "${TMP_DIR}/${DMG_FILE}"

          SHA256=$(sha256sum "${TMP_DIR}/${DMG_FILE}" | awk '{print $1}')

          ruby - "$CASK_FILE" "$LATEST" "$SHA256" <<'RUBY'
          path, version, sha256 = ARGV
          content = File.read(path)

          content.sub!(/^\s*version\s+"[^"]+"/, %(  version "#{version}"))
          content.sub!(/^\s*sha256\s+"[^"]+"/, %(  sha256 "#{sha256}"))

          raise 'Failed to update version line' unless content.include?(%(version "#{version}"))
          raise 'Failed to update sha256 line'  unless content.include?(%(sha256 "#{sha256}"))

          content += "\n" unless content.end_with?("\n")
          File.write(path, content)
          RUBY

      - name: Verify cask formatting
        run: bundle exec rubocop Casks/perch.rb

      - name: Commit and push if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- Casks/perch.rb; then
            echo "No changes to commit."
            exit 0
          fi

          VERSION=$(ruby -e 'puts File.read(ARGV[0])[/^\s*version\s+"([^"]+)"/, 1].to_s' Casks/perch.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/perch.rb
          git commit -m "chore: bump perch cask to v${VERSION}"
          git push origin HEAD:main
