name: Bump Cask (perch)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Both channels push to main, so never let two runs overlap.
concurrency:
  group: perch-bump-cask
  cancel-in-progress: false

jobs:
  bump:
    name: bump ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialised so the second channel checks out the first one's push.
      max-parallel: 1
      matrix:
        include:
          - channel: stable
            cask: Casks/perch.rb
            token: perch
          - channel: beta
            cask: Casks/perch@latest.rb
            token: perch@latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # Exits 0 with skip=true when the channel has nothing to track, which is
      # the normal state of the stable channel until Perch ships a stable
      # release. The reason is logged to stderr.
      - name: Resolve the ${{ matrix.channel }} release
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          scripts/resolve-release.sh \
            --repo tukuyomil032/Perch \
            --channel '${{ matrix.channel }}' \
            --asset-template 'perch-{version}.dmg' >> "$GITHUB_OUTPUT"

      - name: Compare against the cask
        id: compare
        if: steps.resolve.outputs.skip == 'false'
        # LATEST comes from an upstream tag name, so it is passed through the
        # environment rather than interpolated into the script.
        env:
          CASK_FILE: ${{ matrix.cask }}
          LATEST: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          CURRENT=$(ruby -e 'puts File.read(ARGV[0])[/^\s*version\s+"([^"]+)"/, 1].to_s' "$CASK_FILE")
          if [ -z "$CURRENT" ]; then
            echo "Failed to read current version from ${CASK_FILE}" >&2
            exit 1
          fi

          echo "Current: ${CURRENT}"
          echo "Latest:  ${LATEST}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "No cask update required."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Update the cask
        if: steps.compare.outputs.changed == 'true'
        env:
          ASSET_NAME: ${{ steps.resolve.outputs.asset_name }}
          ASSET_URL: ${{ steps.resolve.outputs.asset_url }}
          CASK_FILE: ${{ matrix.cask }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo "Downloading ${ASSET_URL}..."
          curl -fL "$ASSET_URL" -o "${TMP_DIR}/${ASSET_NAME}"
          SHA256=$(sha256sum "${TMP_DIR}/${ASSET_NAME}" | awk '{print $1}')

          ruby - "$CASK_FILE" "$VERSION" "$SHA256" <<'RUBY'
          path, version, sha256 = ARGV
          content = File.read(path)

          version_updated = content.sub!(/^\s*version\s+"[^"]+"/, %(  version "#{version}"))
          sha_updated     = content.sub!(/^\s*sha256\s+"[^"]+"/, %(  sha256 "#{sha256}"))

          raise 'Failed to update version line' unless version_updated
          raise 'Failed to update sha256 line'  unless sha_updated

          File.write(path, content)
          RUBY

      - name: Verify cask formatting
        if: steps.compare.outputs.changed == 'true'
        env:
          CASK_FILE: ${{ matrix.cask }}
        run: bundle exec rubocop "$CASK_FILE"

      # Guarded on main so a workflow_dispatch from a feature branch can be
      # exercised without pushing to main.
      - name: Commit and push
        if: steps.compare.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          CASK_FILE: ${{ matrix.cask }}
          CASK_TOKEN: ${{ matrix.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "$CASK_FILE"; then
            echo "No changes to commit."
            exit 0
          fi

          VERSION=$(ruby -e 'puts File.read(ARGV[0])[/^\s*version\s+"([^"]+)"/, 1].to_s' "$CASK_FILE")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          git commit -m "chore: bump ${CASK_TOKEN} cask to v${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
