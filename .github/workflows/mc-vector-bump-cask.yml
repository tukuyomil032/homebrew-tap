name: Bump Cask (mc-vector)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Homebrew/actions/setup-homebrew@master

      - name: Bump cask PR if new version found
        run: |
          RESULT=$(brew livecheck --cask tukuyomil032/tap/mc-vector --verbose 2>&1 || true)
          echo "$RESULT"
          if echo "$RESULT" | grep -q '==>'; then
            brew bump-cask-pr tukuyomil032/tap/mc-vector --no-browse || true
          else
            echo "No new version found, skipping bump-cask-pr."
          fi
        env:
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: 1
